<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pokemon - Pikachu</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #FFF8E1;
      font-family: 'Barlow', sans-serif;
    }

    /* Full-screen reference box */
    .wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* ── LEFT YELLOW PANEL ── */
    .panel-yellow {
      position: absolute;
      top: 0;
      left: 0;
      width: 57%;
      height: 100%;
      background: #FFCA10;
      border-top-right-radius: 40px;
    }

    /* ── LOGO top-left ── */
    .logo {
      position: absolute;
      top: 28px;
      left: 42px;
      width: 148px;
      mix-blend-mode: multiply;
      z-index: 10;
    }

    /* ── HAMBURGER top-right ── */
    .hamburger {
      position: absolute;
      top: 34px;
      right: 48px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      cursor: pointer;
      z-index: 10;
    }
    .hamburger span {
      display: block;
      width: 30px;
      height: 3px;
      background: #111;
      border-radius: 2px;
    }

    /* ── POKEBALL WATERMARK ── */
    .pokeball {
      position: absolute;
      bottom: -90px;
      left: -68px;
      width: 340px;
      height: 340px;
      opacity: 0.13;
      z-index: 2;
      pointer-events: none;
    }

    /* ── GEN LABEL ── */
    .gen-label {
      position: absolute;
      top: 29%;
      left: 44px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 5px;
      color: #111;
      text-transform: uppercase;
      z-index: 5;
    }

    /* ── POKEMON NAME ── */
    .pokemon-name {
      position: absolute;
      top: 33%;
      left: 38px;
      font-size: 108px;
      font-weight: 900;
      color: #111;
      line-height: 1;
      letter-spacing: -3px;
      z-index: 5;
    }

    /* ── DESCRIPTION ── */
    .description {
      position: absolute;
      top: 57%;
      left: 44px;
      width: 310px;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.78;
      color: #1a1a1a;
      z-index: 5;
    }

    /* ── COUNTER bottom-left ── */
    .counter {
      position: absolute;
      bottom: 42px;
      left: 44px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 15px;
      font-weight: 700;
      color: #111;
      z-index: 5;
    }
    .counter-line {
      width: 38px;
      height: 2.5px;
      background: #111;
      border-radius: 2px;
    }

    /* ── NAV DOTS far right ── */
    .nav-dots {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ccc;
    }
    .dot.active {
      background: #111;
    }

    /* ── PIKACHU ── 
       In the reference: Pikachu is large, 
       right half of screen, slightly left of center-right,
       bottom-anchored, overflows top slightly
    */
    .pikachu-wrap {
      position: absolute;
      right: 2%;
      bottom: -2%;
      width: 52%;
      height: 98%;
      z-index: 8;
      pointer-events: none;
    }
    .pikachu-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: bottom center;
    }
  </style>
</head>
